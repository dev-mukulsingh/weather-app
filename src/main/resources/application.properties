spring.application.name=weatherapp
server.port=8080

# ---- OpenWeatherMap API Config ----
# 1. Go to https://openweathermap.org/ and create a FREE account
# 2. Go to "My API Keys" and copy your key
# 3. Paste it below (replace YOUR_API_KEY_HERE)
openweathermap.api.key=YOUR_API_KEY_HERE
openweathermap.api.baseurl=https://api.openweathermap.org/data/2.5

# Thymeleaf - disable cache during development so HTML changes reflect instantly
spring.thymeleaf.cache=false

# ---- Optional Proxy Config ----
# Only needed if the app still can't reach the internet after this fix.
# Normally auto-detected from your system's http_proxy / https_proxy
# environment variables, but you can set it explicitly here too:
app.proxy.host=
app.proxy.port=0
